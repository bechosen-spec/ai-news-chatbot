[project]
name = "ai-news-chatbot"
version = "0.1.0"
description = "Phase 1 ML and API foundation for an AI news chatbot"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

